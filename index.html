<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b0a12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfaff" media="(prefers-color-scheme: light)" />

    <title>Hyre — AI Recruitment Platform</title>
    <meta name="description" content="Hyre screens every candidate with AI — résumés parsed and scored, screening calls placed, interviews run and offers sent, all in one pipeline." />
    <meta name="author" content="Hyre" />

    <meta property="og:title" content="Hyre — AI Recruitment Platform" />
    <meta property="og:description" content="Hyre screens every candidate with AI — résumés parsed and scored, screening calls placed, interviews run and offers sent, all in one pipeline." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@hyre" />
    <meta name="twitter:image" content="" />

    <!-- Type system: Geist (UI + display), Geist Mono (metrics), Instrument Serif (editorial accent) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap"
    />

    <!-- Paint the correct canvas before React boots, so there is no white flash in dark mode -->
    <script>
      (function () {
        try {
          // 'hirermind-theme' is the pre-rename key; keep reading it so an
          // existing visitor's chosen theme survives the rebrand.
          var stored = localStorage.getItem('hyre-theme') || localStorage.getItem('hirermind-theme');
          var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = isDark ? '#0b0a11' : '#fbfaff';
        } catch (e) {}
      })();
    </script>

    <!-- Suppress Google Sign-In errors if not configured -->
    <script>
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('GSI_LOGGER')) {
          e.preventDefault();
          return false;
        }
      });
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
